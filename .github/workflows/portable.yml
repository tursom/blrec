name: Release binaries and image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  PYINSTALLER_VERSION: "6.21.0"

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c "import runpy; print(runpy.run_path('src/blrec/__init__.py')['__version__'])")"
          release_tag="v${version}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must match vX.Y.Z: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            if [[ "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match source version ${version}" >&2
              exit 1
            fi
            release_tag="${GITHUB_REF_NAME}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Refuse to overwrite an existing release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if error="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>&1 >/dev/null)"; then
            echo "Release ${RELEASE_TAG} already exists and will not be overwritten" >&2
            exit 1
          fi
          if [[ "${error}" != *"HTTP 404"* ]]; then
            echo "${error}" >&2
            exit 1
          fi

  windows:
    name: Build Windows x64
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install . "pyinstaller==${{ env.PYINSTALLER_VERSION }}"

      - name: Build blrec
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm blrec.spec

      - name: Download and verify FFmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $assetName = "ffmpeg-master-latest-win64-lgpl-shared.zip"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" `
            -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq $assetName }
          if ($null -eq $asset -or $asset.digest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "The FFmpeg release asset or its SHA-256 digest is unavailable"
          }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ffmpeg.zip
          $expectedDigest = $asset.digest.Substring(7)
          $actualDigest = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualDigest -ne $expectedDigest) {
            throw "FFmpeg archive checksum mismatch"
          }
          Expand-Archive -LiteralPath ffmpeg.zip -DestinationPath ffmpeg-source

      - name: Package and smoke test
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $archiveStem = "blrec-$env:RELEASE_TAG-windows-x64"
          $packageDir = Join-Path package $archiveStem
          $ffmpegRoot = Get-ChildItem ffmpeg-source -Directory | Select-Object -First 1
          if ($null -eq $ffmpegRoot) {
            throw "The FFmpeg archive has no top-level directory"
          }

          New-Item -ItemType Directory -Path $packageDir, release | Out-Null
          Copy-Item dist\blrec.exe $packageDir
          Copy-Item (Join-Path $ffmpegRoot.FullName "bin\ffmpeg.exe") $packageDir
          Copy-Item (Join-Path $ffmpegRoot.FullName "bin\ffprobe.exe") $packageDir
          Copy-Item (Join-Path $ffmpegRoot.FullName "bin\*.dll") $packageDir
          Copy-Item (Join-Path $ffmpegRoot.FullName "LICENSE.txt") `
            (Join-Path $packageDir "FFmpeg-LICENSE.txt")

          Push-Location $packageDir
          try {
            $versionOutput = .\blrec.exe --version
            if ($versionOutput -notmatch [regex]::Escape($env:VERSION)) {
              throw "blrec --version did not report $env:VERSION"
            }
            .\blrec.exe --help | Out-Null
            .\ffmpeg.exe -version | Out-Null
            .\ffprobe.exe -version | Out-Null
          } finally {
            Pop-Location
          }

          Compress-Archive -Path $packageDir -DestinationPath "release\$archiveStem.zip"

      - name: Upload Windows archive
        uses: actions/upload-artifact@v7
        with:
          name: binary-windows-x64
          path: release/blrec-${{ needs.prepare.outputs.release_tag }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux ${{ matrix.arch }} ${{ matrix.abi }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            abi: glibc
            runner: ubuntu-24.04
            build_image: quay.io/pypa/manylinux_2_28_x86_64
            smoke_image: rockylinux:8-minimal
            file_pattern: x86-64
          - arch: amd64
            abi: musl
            runner: ubuntu-24.04
            build_image: quay.io/pypa/musllinux_1_2_x86_64
            smoke_image: alpine:3.13
            file_pattern: x86-64
          - arch: arm64
            abi: glibc
            runner: ubuntu-24.04-arm
            build_image: quay.io/pypa/manylinux_2_28_aarch64
            smoke_image: rockylinux:8-minimal
            file_pattern: aarch64
          - arch: arm64
            abi: musl
            runner: ubuntu-24.04-arm
            build_image: quay.io/pypa/musllinux_1_2_aarch64
            smoke_image: alpine:3.13
            file_pattern: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build blrec in the compatibility container
        env:
          BUILD_IMAGE: ${{ matrix.build_image }}
          PYINSTALLER_VERSION: ${{ env.PYINSTALLER_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/blrec-build-${{ matrix.arch }}-${{ matrix.abi }}"
          mkdir -p "${output_dir}"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --volume "${output_dir}:/output" \
            --workdir /output \
            "${BUILD_IMAGE}" \
            /bin/bash -lc \
            "mkdir -p /output/source && cp -R /workspace/README.md /workspace/MANIFEST.in /workspace/pyproject.toml /workspace/setup.py /workspace/setup.cfg /workspace/blrec.spec /workspace/src /output/source/ && cd /output/source && /opt/python/cp311-cp311/bin/python -m pip install --disable-pip-version-check --no-cache-dir . pyinstaller==${PYINSTALLER_VERSION} && /opt/python/cp311-cp311/bin/python -m PyInstaller --clean --noconfirm --distpath /output/dist --workpath /output/build blrec.spec"

      - name: Package and smoke test
        env:
          ARCH: ${{ matrix.arch }}
          ABI: ${{ matrix.abi }}
          FILE_PATTERN: ${{ matrix.file_pattern }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SMOKE_IMAGE: ${{ matrix.smoke_image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          archive_stem="blrec-${RELEASE_TAG}-linux-${ARCH}-${ABI}"
          package_root="${RUNNER_TEMP}/package-${ARCH}-${ABI}"
          package_dir="${package_root}/${archive_stem}"
          build_output="${RUNNER_TEMP}/blrec-build-${ARCH}-${ABI}/dist/blrec"
          mkdir -p "${package_dir}" release
          cp "${build_output}" "${package_dir}/blrec"
          chmod 755 "${package_dir}/blrec"

          file "${package_dir}/blrec" | tee binary-type.txt
          grep -qi -- "${FILE_PATTERN}" binary-type.txt
          docker run --rm --volume "${package_dir}:/package:ro" "${SMOKE_IMAGE}" \
            /bin/sh -c "/package/blrec --version | grep -F '${VERSION}' && /package/blrec --help >/dev/null"

          tar -C "${package_root}" -czf "release/${archive_stem}.tar.gz" "${archive_stem}"

      - name: Upload Linux archive
        uses: actions/upload-artifact@v7
        with:
          name: binary-linux-${{ matrix.arch }}-${{ matrix.abi }}
          path: release/blrec-${{ needs.prepare.outputs.release_tag }}-linux-${{ matrix.arch }}-${{ matrix.abi }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Build macOS arm64
    needs: prepare
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install . "pyinstaller==${PYINSTALLER_VERSION}"

      - name: Build, package, and smoke test
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller --clean --noconfirm blrec.spec
          archive_stem="blrec-${RELEASE_TAG}-macos-arm64"
          package_root="${RUNNER_TEMP}/package-macos-arm64"
          package_dir="${package_root}/${archive_stem}"
          mkdir -p "${package_dir}" release
          cp dist/blrec "${package_dir}/blrec"
          chmod 755 "${package_dir}/blrec"

          file -b "${package_dir}/blrec" | tee binary-type.txt
          grep -q '^Mach-O 64-bit executable arm64' binary-type.txt
          codesign --verify --deep --strict --verbose=2 "${package_dir}/blrec"
          "${package_dir}/blrec" --version | grep -F "${VERSION}"
          "${package_dir}/blrec" --help >/dev/null

          tar -C "${package_root}" -czf "release/${archive_stem}.tar.gz" "${archive_stem}"

      - name: Upload macOS archive
        uses: actions/upload-artifact@v7
        with:
          name: binary-macos-arm64
          path: release/blrec-${{ needs.prepare.outputs.release_tag }}-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  image:
    name: Build GHCR image
    needs:
      - prepare
      - windows
      - linux
      - macos
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr.yml
    with:
      publish: ${{ github.event_name == 'push' }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs:
      - prepare
      - windows
      - linux
      - macos
      - image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: release
          merge-multiple: true

      - name: Validate assets and create checksums
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "blrec-${RELEASE_TAG}-linux-amd64-glibc.tar.gz"
            "blrec-${RELEASE_TAG}-linux-amd64-musl.tar.gz"
            "blrec-${RELEASE_TAG}-linux-arm64-glibc.tar.gz"
            "blrec-${RELEASE_TAG}-linux-arm64-musl.tar.gz"
            "blrec-${RELEASE_TAG}-macos-arm64.tar.gz"
            "blrec-${RELEASE_TAG}-windows-x64.zip"
          )
          mapfile -t actual < <(find release -maxdepth 1 -type f -printf '%f\n' | sort)
          if ! diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${actual[@]}"); then
            echo "Downloaded artifacts do not match the release contract" >&2
            exit 1
          fi

          (
            cd release
            printf '%s\0' "${expected[@]}" | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          {
            echo "完整更新日志：https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/CHANGELOG.md"
            echo
            echo "容器镜像：\`ghcr.io/${GITHUB_REPOSITORY_OWNER}/blrec:${RELEASE_TAG}\`、\`ghcr.io/${GITHUB_REPOSITORY_OWNER}/blrec:latest\`"
            echo
            echo "Windows 压缩包已包含 ffmpeg 和 ffprobe；macOS 与 Linux 需要由系统提供 ffmpeg 和 ffprobe。"
            echo
            echo "安装、兼容性与首次运行说明：https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/docs/installation.md"
          } > "${notes_file}"
          gh release create "${RELEASE_TAG}" release/* \
            --verify-tag \
            --generate-notes \
            --latest \
            --notes-file "${notes_file}"
