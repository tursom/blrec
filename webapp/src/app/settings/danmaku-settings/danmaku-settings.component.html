<form nz-form [formGroup]="settingsForm">
  <nz-form-item class="setting-item" appSwitchActionable>
    <nz-form-label
      class="setting-label"
      nzNoColon
      nzTooltipTitle="记录礼物信息到弹幕文件里"
      >记录礼物</nz-form-label
    >
    <nz-form-control
      class="setting-control switch"
      [nzWarningTip]="syncFailedWarningTip"
      [nzValidateStatus]="
        syncStatus.recordGiftSend ? recordGiftSendControl : 'warning'
      "
    >
      <nz-switch formControlName="recordGiftSend"></nz-switch>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item class="setting-item" appSwitchActionable>
    <nz-form-label
      class="setting-label"
      nzNoColon
      nzTooltipTitle="记录免费礼物信息到弹幕文件里"
      >记录免费礼物</nz-form-label
    >
    <nz-form-control
      class="setting-control switch"
      [nzWarningTip]="syncFailedWarningTip"
      [nzValidateStatus]="
        syncStatus.recordFreeGifts ? recordFreeGiftsControl : 'warning'
      "
    >
      <nz-switch formControlName="recordFreeGifts"></nz-switch>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item class="setting-item" appSwitchActionable>
    <nz-form-label
      class="setting-label"
      nzNoColon
      nzTooltipTitle="记录上舰信息到弹幕文件里"
      >记录上舰</nz-form-label
    >
    <nz-form-control
      class="setting-control switch"
      [nzWarningTip]="syncFailedWarningTip"
      [nzValidateStatus]="
        syncStatus.recordGuardBuy ? recordGuardBuyControl : 'warning'
      "
    >
      <nz-switch formControlName="recordGuardBuy"></nz-switch>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item class="setting-item" appSwitchActionable>
    <nz-form-label
      class="setting-label"
      nzNoColon
      nzTooltipTitle="记录 Super Chat 信息到弹幕文件里"
      >记录 Super Chat</nz-form-label
    >
    <nz-form-control
      class="setting-control switch"
      [nzWarningTip]="syncFailedWarningTip"
      [nzValidateStatus]="
        syncStatus.recordSuperChat ? recordSuperChatControl : 'warning'
      "
    >
      <nz-switch formControlName="recordSuperChat"></nz-switch>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item class="setting-item" appSwitchActionable>
    <nz-form-label
      class="setting-label"
      nzNoColon
      nzTooltipTitle="发送者: 弹幕内容"
      >弹幕前加用户名</nz-form-label
    >
    <nz-form-control
      class="setting-control switch"
      [nzWarningTip]="syncFailedWarningTip"
      [nzValidateStatus]="syncStatus.danmuUname ? danmuUnameControl : 'warning'"
    >
      <nz-switch formControlName="danmuUname"></nz-switch>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item class="setting-item" appSwitchActionable>
    <nz-form-label
      class="setting-label"
      nzNoColon
      nzTooltipTitle="保存原始弹幕到 JSON lines 文件，主要用于分析调试。"
      >保存原始弹幕</nz-form-label
    >
    <nz-form-control
      class="setting-control switch"
      [nzWarningTip]="syncFailedWarningTip"
      [nzValidateStatus]="
        syncStatus.saveRawDanmaku ? saveRawDanmakuControl : 'warning'
      "
    >
      <nz-switch formControlName="saveRawDanmaku"></nz-switch>
    </nz-form-control>
  </nz-form-item>
  <nz-form-item class="setting-item" appSwitchActionable>
    <nz-form-label
      class="setting-label"
      nzNoColon
      [nzTooltipTitle]="recordRawDanmakuDuringWaitingTip"
      >待播时持续记录原始弹幕</nz-form-label
    >
    <ng-template #recordRawDanmakuDuringWaitingTip>
      <p>
        只影响原始弹幕 JSONL。
        <br />
        需要先开启保存原始弹幕。
        <br />
        主播开播时会结束 waiting 文件，直播阶段仍按视频文件切段。
        <br />
        如果任务正在直播中，修改将在下一次切段或下次待播阶段生效。
      </p>
    </ng-template>
    <nz-form-control
      class="setting-control switch"
      [nzWarningTip]="syncFailedWarningTip"
      [nzValidateStatus]="
        syncStatus.recordRawDanmakuDuringWaiting
          ? recordRawDanmakuDuringWaitingControl
          : 'warning'
      "
    >
      <nz-switch
        formControlName="recordRawDanmakuDuringWaiting"
        [nzDisabled]="!saveRawDanmakuControl.value"
      ></nz-switch>
    </nz-form-control>
  </nz-form-item>
</form>
